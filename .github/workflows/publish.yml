
name: AutoDeploy Publish

on:
  workflow_run:
    workflows:
      - AutoDeploy CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Run automated tests
        working-directory: ./app
        run: npm test

      - name: Build Docker image
        run: docker build -t autodeploy-api:publish ./app

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/autodeploy-api"

          docker tag autodeploy-api:publish "$IMAGE:sha-$COMMIT_SHA"
          docker tag autodeploy-api:publish "$IMAGE:latest"

      - name: Push Docker image
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/autodeploy-api"

          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:latest"
