
name: AutoDeploy Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Run automated tests
        working-directory: ./app
        run: npm test

      - name: Build Docker image
        run: |
          docker build \
            -t autodeploy-api:publish-test \
            ./app

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Tag Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autodeploy-api"

          docker tag autodeploy-api:publish-test "$IMAGE:latest"
          docker tag autodeploy-api:publish-test "$IMAGE:sha-${GITHUB_SHA}"

      - name: Push Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autodeploy-api"

          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA}"
